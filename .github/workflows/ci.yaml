name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  colcon-test:
    # ROS 2 JazzyのUbuntuバイナリ配布対象に合わせる。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: coverage
          target-ros2-distro: jazzy
          rosdep-skip-keys: mirs ble_server nav2_bringup fields2cover opennav_coverage opennav_coverage_navigator opennav_coverage_bt rviz2

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: PYTHONPATH=. python -m pytest test/ -q
